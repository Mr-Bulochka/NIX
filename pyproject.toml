[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nix-local-agent"
version = "0.3.0"
description = "NIX — local-first project-aware testing agent"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "textual>=0.60",
]

[project.scripts]
nix = "nix.cli:main"

[tool.setuptools.packages.find]
include = ["nix*"]
