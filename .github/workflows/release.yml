name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      backfill_ref:
        description: "Tag (e.g. v0.3.6) or commit SHA of an already-released version to publish. Rebuilds assets, creates or updates the GitHub release, and publishes to PyPI (skipping files that already exist). Leave empty to do nothing."
        required: false
        type: string

concurrency:
  group: release-${{ github.event.inputs.backfill_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: publish tag release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --locked --group dev

      - name: Verify tag matches project version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          pyproject_version=$(uv run --group dev python -c \
            "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag_version pyproject=$pyproject_version"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "::error::Tag $TAG_NAME does not match pyproject.toml version $pyproject_version"
            exit 1
          fi

      - name: Run tests
        run: uv run --group dev pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uv run --group dev twine check dist/*

      - name: Create or update GitHub release
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
            echo "::notice::Updated existing release $TAG_NAME (assets replaced)"
          else
            gh release create "$TAG_NAME" dist/* --generate-notes --verify-tag
            echo "::notice::Created release $TAG_NAME"
          fi

      - name: Detect PyPI auth mode
        id: pypi_auth
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_API_TOKEN is set; publishing with API token auth"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_API_TOKEN is not set; publishing with OIDC trusted publishing"
          fi

      - name: Publish to PyPI (OIDC trusted publishing)
        if: steps.pypi_auth.outputs.mode == 'oidc'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish to PyPI (API token)
        if: steps.pypi_auth.outputs.mode == 'token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  backfill:
    name: backfill existing release to GitHub and PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.backfill_ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backfill_ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Resolve release tag
        id: ref
        env:
          BACKFILL_REF: ${{ inputs.backfill_ref }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${BACKFILL_REF}" >/dev/null; then
            tag="${BACKFILL_REF}"
          else
            tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | head -n 1 || true)
            if [ -z "$tag" ]; then
              echo "::error::No v* version tag points at $BACKFILL_REF; refusing to guess a release tag"
              exit 1
            fi
          fi
          tag_commit=$(git rev-parse "${tag}^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::Tag $tag resolves to $tag_commit but checked out HEAD is $head_commit"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved $BACKFILL_REF to $tag ($head_commit)"

      - name: Verify tag matches project version
        env:
          TAG_NAME: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          tag_version="${TAG_NAME#v}"
          pyproject_version=$(uv run --no-project --python 3.12 python -c \
            "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag_version pyproject=$pyproject_version"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "::error::Tag $TAG_NAME does not match pyproject.toml version $pyproject_version"
            exit 1
          fi

      - name: Build sdist and wheel from ${{ inputs.backfill_ref }}
        run: |
          uv build
          ls -l dist

      - name: Report built version
        run: |
          set -euo pipefail
          sdist=$(ls dist/*.tar.gz 2>/dev/null | head -n 1)
          wheel=$(ls dist/*.whl 2>/dev/null | head -n 1)
          if [ -z "$sdist" ] || [ -z "$wheel" ]; then
            echo "::error::Build for ${{ inputs.backfill_ref }} did not produce both sdist and wheel"
            ls -l dist
            exit 1
          fi
          echo "::notice::Backfill ${{ inputs.backfill_ref }} built: $sdist, $wheel"

      - name: Check metadata
        run: uv tool run --from twine twine check dist/*

      - name: Create or update GitHub release
        env:
          TAG_NAME: ${{ steps.ref.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
            echo "::notice::Updated existing release $TAG_NAME (assets replaced)"
          else
            gh release create "$TAG_NAME" dist/* --generate-notes --verify-tag
            echo "::notice::Created release $TAG_NAME"
          fi

      - name: Detect PyPI auth mode
        id: pypi_auth
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_API_TOKEN is set; publishing with API token auth"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_API_TOKEN is not set; publishing with OIDC trusted publishing"
          fi

      - name: Publish to PyPI (OIDC trusted publishing)
        if: steps.pypi_auth.outputs.mode == 'oidc'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish to PyPI (API token)
        if: steps.pypi_auth.outputs.mode == 'token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
